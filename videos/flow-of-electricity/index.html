<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>How Electricity Flows</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/MotionPathPlugin.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070b14;
      }
      body {
        font-family: "Oswald", sans-serif;
        color: #eaf6ff;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 38%, #0e1626 0%, #070b14 70%);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: block;
      }

      /* ---- Title / closing tagline ---- */
      .headline-slot {
        position: absolute;
        top: 88px;
        left: 0;
        width: 100%;
        text-align: center;
      }
      #title-text {
        display: inline-block;
        font-size: 68px;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: #6fe0ff;
        text-shadow: 0 0 28px rgba(111, 224, 255, 0.55);
        opacity: 0;
      }
      #closing-text {
        display: inline-block;
        font-size: 40px;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: #cfeeff;
        opacity: 0;
      }

      /* ---- Diagram ---- */
      .diagram-wrap {
        position: absolute;
        left: 260px;
        top: 168px;
        width: 1400px;
        height: 784px;
      }
      .diagram-wrap svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .wire {
        fill: none;
        stroke: #6fe0ff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #flow-loop {
        fill: none;
        stroke: none;
      }
      .flow-dot {
        fill: #eafcff;
        filter: drop-shadow(0 0 10px rgba(111, 224, 255, 0.95));
      }
      #battery-group,
      #bulb-group {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .batt-plate-long {
        stroke: #eafcff;
        stroke-width: 5;
        stroke-linecap: round;
      }
      .batt-plate-short {
        stroke: #eafcff;
        stroke-width: 16;
        stroke-linecap: round;
      }
      .batt-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
        fill: #9fe9ff;
      }
      #bulb-outline {
        fill: #0a1120;
        stroke: #eafcff;
        stroke-width: 5;
      }
      #bulb-filament {
        stroke: #eafcff;
        stroke-width: 4;
        stroke-linecap: round;
      }
      #bulb-rays {
        opacity: 0;
      }
      #bulb-rays line {
        stroke: #ffb648;
        stroke-width: 6;
        stroke-linecap: round;
      }
      #bulb-glow {
        opacity: 0;
      }

      /* ---- Captions ---- */
      .caption-slot {
        position: absolute;
        bottom: 108px;
        left: 0;
        width: 100%;
        text-align: center;
      }
      .caption-text {
        display: inline-block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 34px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #eaf6ff;
        opacity: 0;
        padding-bottom: 14px;
        border-bottom: 4px solid var(--accent, #6fe0ff);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <!-- Diagram: visible for the whole piece; internal reveal is timeline-driven -->
      <section id="diagram" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div class="diagram-wrap">
          <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
            <!-- invisible loop used only for current-dot motion -->
            <path id="flow-loop" d="M150,150 L850,150 L850,450 L150,450 Z" />

            <!-- wire segments (drawn on progressively) -->
            <path id="wire-seg-1" class="wire" d="M150,150 L150,270" />
            <path id="wire-seg-2" class="wire" d="M150,330 L150,450 L850,450 L850,340" />
            <path id="wire-seg-3" class="wire" d="M850,260 L850,150 L150,150" />

            <!-- battery symbol -->
            <g id="battery-group">
              <line class="wire" x1="150" y1="270" x2="150" y2="285" />
              <line class="batt-plate-long" x1="110" y1="285" x2="190" y2="285" />
              <line class="batt-plate-short" x1="130" y1="305" x2="170" y2="305" />
              <line class="wire" x1="150" y1="305" x2="150" y2="330" />
              <text class="batt-label" x="200" y="278">+</text>
              <text class="batt-label" x="200" y="322">&#8722;</text>
            </g>

            <!-- bulb symbol -->
            <g id="bulb-group">
              <circle id="bulb-glow" cx="850" cy="300" r="72" fill="#ffb648" opacity="0" />
              <g id="bulb-rays">
                <line x1="850" y1="238" x2="850" y2="216" />
                <line x1="908" y1="258" x2="926" y2="242" />
                <line x1="908" y1="342" x2="926" y2="358" />
                <line x1="792" y1="258" x2="774" y2="242" />
                <line x1="792" y1="342" x2="774" y2="358" />
                <line x1="850" y1="362" x2="850" y2="384" />
              </g>
              <circle id="bulb-outline" cx="850" cy="300" r="40" />
              <path id="bulb-filament" d="M826,282 L874,318 M874,282 L826,318" fill="none" />
            </g>

            <!-- current dots -->
            <circle class="flow-dot" id="flow-dot-0" cx="150" cy="150" r="9" />
            <circle class="flow-dot" id="flow-dot-1" cx="150" cy="150" r="9" />
            <circle class="flow-dot" id="flow-dot-2" cx="150" cy="150" r="9" />
            <circle class="flow-dot" id="flow-dot-3" cx="150" cy="150" r="9" />
          </svg>
        </div>
      </section>

      <!-- Title -->
      <section id="title-clip" class="clip" data-start="0" data-duration="2" data-track-index="1">
        <div class="headline-slot"><span id="title-text">How Electricity Flows</span></div>
      </section>

      <!-- Captions -->
      <section
        id="caption-a-clip"
        class="clip"
        data-start="2.7"
        data-duration="1.4"
        data-track-index="2"
      >
        <div class="caption-slot">
          <span id="caption-a" class="caption-text" style="--accent: #6fe0ff"
            >A battery pushes the current</span
          >
        </div>
      </section>
      <section
        id="caption-b-clip"
        class="clip"
        data-start="6.5"
        data-duration="1.4"
        data-track-index="2"
      >
        <div class="caption-slot">
          <span id="caption-b" class="caption-text" style="--accent: #6fe0ff"
            >Current flows through the circuit</span
          >
        </div>
      </section>
      <section
        id="caption-c-clip"
        class="clip"
        data-start="10"
        data-duration="1.4"
        data-track-index="2"
      >
        <div class="caption-slot">
          <span id="caption-c" class="caption-text" style="--accent: #ffb648"
            >&#8230;and lights the bulb</span
          >
        </div>
      </section>

      <!-- Closing tagline -->
      <section
        id="closing-clip"
        class="clip"
        data-start="13"
        data-duration="2"
        data-track-index="1"
      >
        <div class="headline-slot">
          <span id="closing-text">Electricity always flows in a closed loop.</span>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      gsap.registerPlugin(MotionPathPlugin);

      const tl = gsap.timeline({ paused: true });

      // ---- Title ----
      tl.fromTo("#title-text", { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.to("#title-text", { opacity: 0, y: -18, duration: 0.4, ease: "power2.in" }, 1.5);

      // ---- Wire segments (measure + draw-on) ----
      const wireSegs = document.querySelectorAll(".wire");
      wireSegs.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      tl.to("#wire-seg-1", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 0.3);
      tl.fromTo(
        "#battery-group",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" },
        0.75,
      );
      tl.to("#wire-seg-2", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.05);
      tl.fromTo(
        "#bulb-group",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" },
        1.75,
      );
      tl.to("#wire-seg-3", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 2.05);

      // ---- Current dots: 4 dots evenly spaced around the loop, looping ----
      // cycle*5 (1 run + 4 repeats) spans exactly 2.6s -> 15.0s
      const CYCLE = 2.48;
      const FLOW_START = 2.6;
      const REPEATS = 4;
      for (let i = 0; i < 4; i++) {
        const startFrac = i * 0.25;
        tl.to(
          `#flow-dot-${i}`,
          {
            motionPath: {
              path: "#flow-loop",
              start: startFrac,
              end: startFrac + 1,
              autoRotate: false,
            },
            duration: CYCLE,
            ease: "none",
            repeat: REPEATS,
          },
          FLOW_START,
        );
      }

      // ---- Bulb lights once current reaches it ----
      tl.to("#bulb-glow", { opacity: 0.9, duration: 0.6, ease: "power1.out" }, 3.4);
      tl.to("#bulb-rays", { opacity: 1, duration: 0.6, ease: "power1.out" }, 3.4);
      tl.to("#bulb-outline", { fill: "#3a2a12", duration: 0.6, ease: "power1.out" }, 3.4);

      // ---- Captions ----
      tl.fromTo("#caption-a", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.7);
      tl.to("#caption-a", { opacity: 0, duration: 0.2, ease: "power1.in" }, 3.9);

      tl.fromTo("#caption-b", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 6.5);
      tl.to("#caption-b", { opacity: 0, duration: 0.2, ease: "power1.in" }, 7.7);

      tl.fromTo("#caption-c", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 10.0);
      tl.to("#caption-c", { opacity: 0, duration: 0.2, ease: "power1.in" }, 11.2);

      // ---- Closing tagline ----
      tl.fromTo(
        "#closing-text",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        13.0,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
