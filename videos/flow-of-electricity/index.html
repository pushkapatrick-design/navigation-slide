<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>How Electricity Flows</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/MotionPathPlugin.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070b14;
      }
      body {
        font-family: "Oswald", sans-serif;
        color: #eaf6ff;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070b14;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: block;
      }
      .scene-bg {
        position: absolute;
        inset: 0;
      }
      #scene-water,
      #scene-force,
      #scene-circuit,
      #scene-close {
        z-index: 1;
      }
      #scene-wipe-1,
      #scene-wipe-2 {
        z-index: 10;
      }
      .headline {
        position: absolute;
        top: 96px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 58px;
        font-weight: 700;
        letter-spacing: 0.03em;
        opacity: 0;
      }

      /* ================= Scene 1 — water/pipe metaphor ================= */
      #scene-water .scene-bg {
        background: radial-gradient(circle at 50% 40%, #0e2a2a 0%, #070b14 70%);
      }
      #scene-water .headline {
        color: #3fe7c8;
        text-shadow: 0 0 26px rgba(63, 231, 200, 0.5);
      }
      .flange {
        position: absolute;
        border-radius: 50%;
        border: 6px solid #63767f;
        background: radial-gradient(circle at 35% 30%, #59696f 0%, #232f34 100%);
        opacity: 0;
      }
      .pump {
        position: absolute;
        left: 156px;
        top: 470px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #6ff5df 0%, #159685 60%, #0c4b43 100%);
        border: 4px solid #3fe7c8;
        opacity: 0;
      }
      .pipe-casing {
        position: absolute;
        left: 280px;
        top: 460px;
        width: 1280px;
        height: 170px;
        border-radius: 85px;
        background: linear-gradient(180deg, #4a5a62 0%, #232f34 45%, #161e22 55%, #4a5a62 100%);
        border: 3px solid #63767f;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        opacity: 0;
      }
      .pipe-joint {
        position: absolute;
        top: 0;
        width: 14px;
        height: 100%;
        background: rgba(8, 12, 14, 0.55);
      }
      .pipe-window {
        position: absolute;
        left: 14px;
        top: 22px;
        right: 14px;
        bottom: 22px;
        border-radius: 70px;
        overflow: hidden;
        background: linear-gradient(180deg, #4fecd0 0%, #12564d 55%, #082622 100%);
      }
      .water-wave {
        position: absolute;
        top: 0;
        left: -1400px;
        width: 2820px;
        height: 100%;
        opacity: 0.28;
        background: repeating-linear-gradient(
          100deg,
          rgba(255, 255, 255, 0.55) 0px,
          rgba(255, 255, 255, 0.55) 3px,
          rgba(255, 255, 255, 0) 3px,
          rgba(255, 255, 255, 0) 70px
        );
      }
      .water-wave.wave-2 {
        opacity: 0.16;
      }
      .water-highlight {
        position: absolute;
        top: 14px;
        left: -600px;
        width: 2400px;
        height: 18px;
        border-radius: 9px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.6) 50%,
          rgba(255, 255, 255, 0) 100%
        );
      }
      .bubble {
        position: absolute;
        top: 55%;
        left: 20px;
        width: 38px;
        height: 38px;
        margin-top: -19px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #f2fffb 0%, #6ff5df 55%, rgba(63, 231, 200, 0) 78%);
        opacity: 0;
      }
      .valve {
        position: absolute;
        left: 1544px;
        top: 494px;
        width: 102px;
        height: 102px;
        border-radius: 50%;
        background: #0b2422;
        border: 5px solid #3fe7c8;
        opacity: 0;
      }
      .valve-core {
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        background: #eafffa;
        opacity: 0;
      }
      .valve-rays {
        position: absolute;
        left: 1595px;
        top: 545px;
        width: 0;
        height: 0;
        opacity: 0;
      }
      .valve-rays i {
        position: absolute;
        width: 6px;
        height: 26px;
        background: #3fe7c8;
        border-radius: 3px;
        left: -3px;
        top: -80px;
        transform-origin: 3px 80px;
      }

      /* ================= Transition wipes ================= */
      .wipe-panel {
        position: absolute;
        inset: 0;
        transform: translateX(-1920px);
      }
      #wipe-panel-1 {
        background: linear-gradient(120deg, #1c5a54 0%, #4b3f9e 55%, #7c6fef 100%);
      }
      #wipe-panel-2 {
        background: linear-gradient(120deg, #5b4fd8 0%, #3f7fae 55%, #6fe0ff 100%);
      }

      /* ================= Scene 2 — force / voltage hill ================= */
      #scene-force .scene-bg {
        background: radial-gradient(circle at 50% 40%, #1c1840 0%, #070b14 70%);
      }
      #scene-force .headline {
        color: #b9a8ff;
        text-shadow: 0 0 26px rgba(124, 111, 239, 0.55);
      }
      .slope-edge {
        fill: none;
        stroke: #ffd166;
        stroke-width: 6;
        stroke-linecap: round;
      }
      #hill-wedge {
        opacity: 0;
      }
      .potential-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
        opacity: 0;
      }
      #voltage-bracket {
        opacity: 0;
      }
      #charge-ball {
        opacity: 0;
        filter: drop-shadow(0 0 16px rgba(255, 209, 102, 0.9));
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }

      /* ================= Scene 3 — the real circuit ================= */
      #scene-circuit .scene-bg {
        background: radial-gradient(circle at 50% 38%, #0e1626 0%, #070b14 70%);
      }
      #scene-circuit .headline {
        color: #6fe0ff;
        text-shadow: 0 0 28px rgba(111, 224, 255, 0.55);
        top: 70px;
        font-size: 44px;
      }
      .diagram-wrap {
        position: absolute;
        left: 260px;
        top: 190px;
        width: 1400px;
        height: 784px;
      }
      .diagram-wrap svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .wire {
        fill: none;
        stroke: #6fe0ff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #flow-loop {
        fill: none;
        stroke: none;
      }
      .flow-dot {
        fill: #eafcff;
        filter: drop-shadow(0 0 10px rgba(111, 224, 255, 0.95));
      }
      #battery-group,
      #bulb-group {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .batt-plate-long {
        stroke: #eafcff;
        stroke-width: 5;
        stroke-linecap: round;
      }
      .batt-plate-short {
        stroke: #eafcff;
        stroke-width: 16;
        stroke-linecap: round;
      }
      .batt-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
        fill: #9fe9ff;
      }
      #bulb-outline {
        fill: #0a1120;
        stroke: #eafcff;
        stroke-width: 5;
      }
      #bulb-filament {
        stroke: #eafcff;
        stroke-width: 4;
        stroke-linecap: round;
      }
      #bulb-rays {
        opacity: 0;
      }
      #bulb-rays line {
        stroke: #ffb648;
        stroke-width: 6;
        stroke-linecap: round;
      }
      #bulb-glow {
        opacity: 0;
      }
      #bulb-flash {
        opacity: 0;
      }

      /* ================= Scene 4 — kinetic close ================= */
      #scene-close .scene-bg {
        background: radial-gradient(circle at 50% 50%, #14243a 0%, #070b14 72%);
      }
      .close-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 220px;
      }
      .close-line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 20px;
      }
      .close-word {
        display: inline-block;
        font-size: 78px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #eaf6ff;
        opacity: 0;
      }
      .close-word.accent {
        color: #ffb648;
        text-shadow: 0 0 26px rgba(255, 182, 72, 0.55);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1920"
      data-height="1080"
    >
      <!-- ============ Scene 1: water/pipe metaphor (0.0 - 5.6s) ============ -->
      <section id="scene-water" class="clip" data-start="0" data-duration="6.9" data-track-index="0">
        <div class="scene-bg"></div>
        <div class="headline" id="water-title">Think of it like water</div>

        <div class="flange" id="flange-pump" style="left: 140px; top: 454px; width: 182px; height: 182px"></div>
        <div class="pump" id="pump"></div>

        <div class="pipe-casing" id="pipe-casing">
          <div class="pipe-joint" style="left: 260px"></div>
          <div class="pipe-joint" style="left: 620px"></div>
          <div class="pipe-joint" style="left: 980px"></div>
          <div class="pipe-window">
            <div class="water-wave" id="wave-1" data-layout-allow-overflow></div>
            <div class="water-wave wave-2" id="wave-2" data-layout-allow-overflow></div>
            <div class="water-highlight" id="water-highlight" data-layout-allow-overflow></div>
            <div class="bubble" id="bubble-0"></div>
            <div class="bubble" id="bubble-1"></div>
            <div class="bubble" id="bubble-2"></div>
          </div>
        </div>

        <div class="flange" id="flange-valve" style="left: 1528px; top: 478px; width: 134px; height: 134px"></div>
        <div class="valve" id="valve">
          <div class="valve-core" id="valve-core"></div>
        </div>
        <div class="valve-rays" id="valve-rays">
          <i style="transform: rotate(0deg)"></i>
          <i style="transform: rotate(60deg)"></i>
          <i style="transform: rotate(120deg)"></i>
          <i style="transform: rotate(180deg)"></i>
          <i style="transform: rotate(240deg)"></i>
          <i style="transform: rotate(300deg)"></i>
        </div>
      </section>

      <!-- ============ Transition wipe 1: water -> force (4.8 - 6.1s) ============ -->
      <section id="scene-wipe-1" class="clip" data-start="6.1" data-duration="1.3" data-track-index="9">
        <div class="wipe-panel" id="wipe-panel-1"></div>
      </section>

      <!-- ============ Scene 2: force / voltage is the push (5.0 - 10.5s) ============ -->
      <section id="scene-force" class="clip" data-start="7.0" data-duration="6.4" data-track-index="1">
        <div class="scene-bg"></div>
        <div class="headline" id="force-title">That force is called voltage</div>

        <div class="diagram-wrap">
          <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="hillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffd166" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#5b4fd8" stop-opacity="0.55" />
              </linearGradient>
            </defs>

            <polygon id="hill-wedge" points="150,150 150,450 850,450" fill="url(#hillGrad)" />
            <path id="hill-edge" class="slope-edge" d="M150,150 L850,450" />

            <text id="label-high" class="potential-label" x="150" y="112" text-anchor="middle" fill="#ffd166">
              + HIGH POTENTIAL
            </text>
            <text id="label-low" class="potential-label" x="850" y="498" text-anchor="middle" fill="#8b7cf6">
              &#8722; LOW POTENTIAL
            </text>

            <g id="voltage-bracket">
              <line x1="98" y1="160" x2="98" y2="440" stroke="#ffd166" stroke-width="4" />
              <polygon points="98,148 88,170 108,170" fill="#ffd166" />
              <polygon points="98,452 88,430 108,430" fill="#ffd166" />
              <text
                x="55"
                y="300"
                fill="#ffd166"
                font-family="IBM Plex Mono, monospace"
                font-size="24"
                text-anchor="middle"
                transform="rotate(-90 55 300)"
              >
                VOLTAGE&#8202;&#8202;THE PUSH
              </text>
            </g>

            <circle id="charge-ball" cx="150" cy="150" r="24" fill="#ffd166" />
          </svg>
        </div>
      </section>

      <!-- ============ Transition wipe 2: force -> circuit (10.0 - 11.3s) ============ -->
      <section id="scene-wipe-2" class="clip" data-start="13.0" data-duration="1.3" data-track-index="9">
        <div class="wipe-panel" id="wipe-panel-2"></div>
      </section>

      <!-- ============ Scene 3: the real circuit (10.2 - 18.0s) ============ -->
      <section id="scene-circuit" class="clip" data-start="14.0" data-duration="8.4" data-track-index="2">
        <div class="scene-bg"></div>
        <div class="headline" id="circuit-title">Now, the real circuit</div>

        <div class="diagram-wrap">
          <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
            <!-- invisible loop used only for current-dot motion -->
            <path id="flow-loop" d="M150,150 L850,150 L850,450 L150,450 Z" />

            <!-- wire segments (drawn on progressively) -->
            <path id="wire-seg-1" class="wire" d="M150,150 L150,270" />
            <path id="wire-seg-2" class="wire" d="M150,330 L150,450 L850,450 L850,340" />
            <path id="wire-seg-3" class="wire" d="M850,260 L850,150 L150,150" />

            <!-- battery symbol -->
            <g id="battery-group">
              <line class="wire" x1="150" y1="270" x2="150" y2="285" />
              <line class="batt-plate-long" x1="110" y1="285" x2="190" y2="285" />
              <line class="batt-plate-short" x1="130" y1="305" x2="170" y2="305" />
              <line class="wire" x1="150" y1="305" x2="150" y2="330" />
              <text class="batt-label" x="200" y="278">+</text>
              <text class="batt-label" x="200" y="322">&#8722;</text>
            </g>

            <!-- bulb symbol -->
            <g id="bulb-group">
              <circle id="bulb-flash" cx="850" cy="300" r="150" fill="#ffb648" opacity="0" />
              <circle id="bulb-glow" cx="850" cy="300" r="72" fill="#ffb648" opacity="0" />
              <g id="bulb-rays">
                <line x1="850" y1="238" x2="850" y2="216" />
                <line x1="908" y1="258" x2="926" y2="242" />
                <line x1="908" y1="342" x2="926" y2="358" />
                <line x1="792" y1="258" x2="774" y2="242" />
                <line x1="792" y1="342" x2="774" y2="358" />
                <line x1="850" y1="362" x2="850" y2="384" />
              </g>
              <circle id="bulb-outline" cx="850" cy="300" r="40" />
              <path id="bulb-filament" d="M826,282 L874,318 M874,282 L826,318" fill="none" />
            </g>

            <!-- current dots -->
            <circle class="flow-dot" id="flow-dot-0" cx="150" cy="150" r="9" />
            <circle class="flow-dot" id="flow-dot-1" cx="150" cy="150" r="9" />
            <circle class="flow-dot" id="flow-dot-2" cx="150" cy="150" r="9" />
            <circle class="flow-dot" id="flow-dot-3" cx="150" cy="150" r="9" />
          </svg>
        </div>
      </section>

      <!-- ============ Scene 4: kinetic-type close (17.4 - 20.0s) ============ -->
      <section id="scene-close" class="clip" data-start="21.4" data-duration="3.6" data-track-index="3">
        <div class="scene-bg"></div>
        <div class="close-wrap">
          <div class="close-line" id="close-line">
            <span class="close-word">That&#8217;s</span>
            <span class="close-word">the</span>
            <span class="close-word accent">flow</span>
            <span class="close-word">of</span>
            <span class="close-word accent">electricity.</span>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      gsap.registerPlugin(MotionPathPlugin);

      const tl = gsap.timeline({ paused: true });

      /* =========================================================
         Scene 1 — water / pipe metaphor
         ========================================================= */
      tl.fromTo("#water-title", { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.to("#water-title", { opacity: 0, y: -18, duration: 0.35, ease: "power2.in" }, 1.9);

      tl.fromTo("#flange-pump", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.25);
      tl.fromTo("#pump", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 0.35);
      tl.fromTo("#pipe-casing", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0.5);
      tl.fromTo("#flange-valve", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.7);
      tl.fromTo("#valve", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 0.85);

      // pump pulse (finite, loops through the scene)
      tl.to("#pump", { scale: 1.12, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 13 }, 0.9);

      // flowing water: two shimmering wave layers moving at different speeds (parallax), finite repeat
      tl.to("#wave-1", { x: 1400, duration: 2.3, ease: "none", repeat: 2 }, 0.6);
      tl.to("#wave-2", { x: -1400, duration: 2.8, ease: "none", repeat: 2 }, 0.6);
      tl.to("#water-highlight", { x: 600, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.6);

      // drifting bubbles, straight-line flow across the pipe (distinct technique from scene 3's motion-path)
      const bubbleTravel = 1180;
      [0, 1, 2].forEach((i, idx) => {
        const start = 0.65 + idx * 0.55;
        tl.fromTo(
          `#bubble-${i}`,
          { x: 0, opacity: 0 },
          { x: bubbleTravel, opacity: 1, duration: 1.05, ease: "none", repeat: 5 },
          start,
        );
        tl.fromTo(`#bubble-${i}`, { opacity: 0 }, { opacity: 0.9, duration: 0.2 }, start);
      });

      // water reaches the valve: it lights up (foreshadows the bulb)
      tl.to("#valve-core", { opacity: 1, scale: 1.15, duration: 0.35, ease: "power2.out" }, 3.2);
      tl.to("#valve-rays", { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.2);
      tl.to("#valve-rays i", { scaleY: 1.4, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 6 }, 3.25);

      /* =========================================================
         Transition wipe 1: teal -> violet sweep covers, then reveals
         ========================================================= */
      tl.fromTo("#wipe-panel-1", { x: -1920 }, { x: 0, duration: 0.35, ease: "power2.inOut" }, 6.1);
      tl.to("#wipe-panel-1", { x: 1920, duration: 0.35, ease: "power2.inOut" }, 6.75);

      /* =========================================================
         Scene 2 — force / voltage is the push
         ========================================================= */
      tl.fromTo("#force-title", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.3);
      tl.to("#force-title", { opacity: 0, y: -14, duration: 0.35, ease: "power2.in" }, 8.8);

      const slopeEdge = document.getElementById("hill-edge");
      const slopeLen = slopeEdge.getTotalLength();
      slopeEdge.style.strokeDasharray = String(slopeLen);
      slopeEdge.style.strokeDashoffset = String(slopeLen);
      tl.to("#hill-edge", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 7.5);
      tl.fromTo("#hill-wedge", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 7.85);
      tl.fromTo("#label-high", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.0);
      tl.fromTo("#label-low", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.15);
      tl.fromTo("#voltage-bracket", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 8.3);

      tl.fromTo(
        "#charge-ball",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" },
        9.0,
      );
      tl.to(
        "#charge-ball",
        {
          motionPath: { path: "#hill-edge", autoRotate: false },
          duration: 1.6,
          ease: "power2.in",
        },
        9.35,
      );
      tl.fromTo(
        "#charge-ball",
        { scale: 1 },
        { scale: 1.2, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 },
        10.95,
      );
      tl.to("#charge-ball", { scale: 1.08, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 11.3);

      /* =========================================================
         Transition wipe 2: violet/gold -> electric cyan
         ========================================================= */
      tl.fromTo("#wipe-panel-2", { x: -1920 }, { x: 0, duration: 0.35, ease: "power2.inOut" }, 13.0);
      tl.to("#wipe-panel-2", { x: 1920, duration: 0.35, ease: "power2.inOut" }, 13.65);

      /* =========================================================
         Scene 3 — the real circuit
         ========================================================= */
      tl.fromTo("#circuit-title", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 14.2);
      tl.to("#circuit-title", { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" }, 15.2);

      const wireSegs = document.querySelectorAll(".wire");
      wireSegs.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      tl.to("#wire-seg-1", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 14.5);
      tl.fromTo(
        "#battery-group",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
        14.85,
      );
      tl.to("#wire-seg-2", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 15.15);
      tl.fromTo(
        "#bulb-group",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
        15.7,
      );
      tl.to("#wire-seg-3", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 15.95);

      // current dots: 4 evenly spaced, looping around the loop
      // cycle 1.45 x 4 iterations (1 run + repeat:3) spans exactly 16.5 -> 22.3
      const CYCLE = 1.45;
      const FLOW_START = 16.5;
      const REPEATS = 3;
      for (let i = 0; i < 4; i++) {
        const startFrac = i * 0.25;
        tl.to(
          `#flow-dot-${i}`,
          {
            motionPath: { path: "#flow-loop", start: startFrac, end: startFrac + 1, autoRotate: false },
            duration: CYCLE,
            ease: "none",
            repeat: REPEATS,
          },
          FLOW_START,
        );
      }

      // bulb lights with a punchy flash once current arrives
      tl.to("#bulb-flash", { opacity: 0.55, duration: 0.18, ease: "power1.out" }, 17.1);
      tl.to("#bulb-flash", { opacity: 0, duration: 0.55, ease: "power1.in" }, 17.28);
      tl.to("#bulb-glow", { opacity: 0.95, duration: 0.3, ease: "power1.out" }, 17.1);
      tl.to("#bulb-rays", { opacity: 1, duration: 0.3, ease: "power1.out" }, 17.1);
      tl.to("#bulb-outline", { fill: "#3a2a12", duration: 0.3, ease: "power1.out" }, 17.1);
      tl.fromTo("#bulb-group", { scale: 1 }, { scale: 1.12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 17.1);

      // ambient glow pulse keeps the lit bulb feeling alive through the longer hold
      tl.to("#bulb-glow", { opacity: 0.78, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 4 }, 17.6);

      /* =========================================================
         Scene 4 — kinetic-type close (per-word stagger)
         ========================================================= */
      tl.fromTo(
        "#close-line .close-word",
        { opacity: 0, y: 26, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.09 },
        21.6,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
